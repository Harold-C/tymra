name: tymra

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://tymra:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@tymra-postgres:5432/tymra_dev
  REDIS_URL: redis://tymra-redis:6379
  BASE_DOMAIN: ${BASE_DOMAIN:-tymra.test}
  APP_BASE_URL: ${PUBLIC_ORIGIN:-https://tymra.test}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://tymra.test}
  ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://ops.tymra.test}
  WORKER_INTERNAL_URL: http://tymra-worker-api:3100
  BROWSER_WORKER_INTERNAL_URL: http://tymra-browser-worker:18888
  BROWSER_WORKER_TOKEN: ${CRON_SECRET:?Set CRON_SECRET in .env}
  BROWSER_WORKER_TIMEOUT_MS: ${BROWSER_WORKER_TIMEOUT_MS:-60000}
  BROWSER_EVIDENCE_ROOT: /browser-evidence
  EVENTFINDA_MIN_DELAY_MS: ${EVENTFINDA_MIN_DELAY_MS:-4000}
  EVENTFINDA_DELAY_JITTER_MS: ${EVENTFINDA_DELAY_JITTER_MS:-3000}
  EVENTFINDA_DAILY_REQUEST_BUDGET: ${EVENTFINDA_DAILY_REQUEST_BUDGET:-2500}
  EVENTFINDA_DISCOVERY_MAX_PAGES: ${EVENTFINDA_DISCOVERY_MAX_PAGES:-250}
  EVENTFINDA_DETAIL_BATCH_SIZE: ${EVENTFINDA_DETAIL_BATCH_SIZE:-80}
  TICKETMASTER_MIN_DELAY_MS: ${TICKETMASTER_MIN_DELAY_MS:-5000}
  TICKETMASTER_DELAY_JITTER_MS: ${TICKETMASTER_DELAY_JITTER_MS:-4000}
  TICKETMASTER_DAILY_REQUEST_BUDGET: ${TICKETMASTER_DAILY_REQUEST_BUDGET:-20}
  TICKETMASTER_DISCOVERY_MAX_PAGES: ${TICKETMASTER_DISCOVERY_MAX_PAGES:-5}
  TICKETMASTER_DETAIL_BATCH_SIZE: ${TICKETMASTER_DETAIL_BATCH_SIZE:-3}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
  ADMIN_DEV_PASSWORD: ${ADMIN_DEV_PASSWORD:-}
  RESULT_TOKEN_SECRET: ${RESULT_TOKEN_SECRET:?Set RESULT_TOKEN_SECRET in .env}
  ACCESS_KEY_SECRET: ${ACCESS_KEY_SECRET:?Set ACCESS_KEY_SECRET in .env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
  CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
  PROVIDER_MODE: ${PROVIDER_MODE:-demo}
  DEFAULT_MARKET: ${DEFAULT_MARKET:-christchurch}
  AUTO_PUBLISH_ENABLED: ${AUTO_PUBLISH_ENABLED:-true}
  ACCEPT_NEW_CHECKS: ${ACCEPT_NEW_CHECKS:-true}
  EMAIL_PROVIDER: ${COMPOSE_EMAIL_PROVIDER:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:-Tymra by Synix <no-reply@tymra.test>}
  SMTP_URL: ${COMPOSE_SMTP_URL:-smtp://tymra-mailpit:1025}
  RESULT_LINK_TTL_DAYS: ${RESULT_LINK_TTL_DAYS:-14}
  WORKER_ID: ${WORKER_ID:-tymra-worker-compose}
  WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
  WORKER_API_HOST: 0.0.0.0
  WORKER_API_PORT: 3100
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
  HIGH_FREQUENCY_SCHEDULER_ENABLED: ${HIGH_FREQUENCY_SCHEDULER_ENABLED:-false}
  PUBLIC_COLLECTION_MODE: ${PUBLIC_COLLECTION_MODE:-live}
  FIXTURE_COLLECTION_ENABLED: ${FIXTURE_COLLECTION_ENABLED:-true}
  RAW_ARTIFACT_TTL_HOURS: ${RAW_ARTIFACT_TTL_HOURS:-72}
  RAW_ARTIFACT_FAILURE_TTL_HOURS: ${RAW_ARTIFACT_FAILURE_TTL_HOURS:-168}
  FRESHNESS_CORE_HOURS: ${FRESHNESS_CORE_HOURS:-24}
  FRESHNESS_NEAR_TERM_SKEW_HOURS: ${FRESHNESS_NEAR_TERM_SKEW_HOURS:-2}
  FRESHNESS_LONG_TERM_SKEW_HOURS: ${FRESHNESS_LONG_TERM_SKEW_HOURS:-6}
  PREVIEW_UNIT_24H_LIMIT: ${PREVIEW_UNIT_24H_LIMIT:-1}
  PREVIEW_DEVICE_UNITS_24H_LIMIT: ${PREVIEW_DEVICE_UNITS_24H_LIMIT:-3}
  PREVIEW_DEVICE_UNITS_30D_LIMIT: ${PREVIEW_DEVICE_UNITS_30D_LIMIT:-10}
  FORMAL_EMAIL_ACTIVE_LIMIT: ${FORMAL_EMAIL_ACTIVE_LIMIT:-1}
  FORMAL_UNIT_30D_LIMIT: ${FORMAL_UNIT_30D_LIMIT:-1}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tymra_dev
      POSTGRES_USER: tymra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tymra -d tymra_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      default:
        aliases:
          - tymra-postgres

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - tymra-redis

  migrate:
    build:
      context: .
      target: dev
    environment: *app-environment
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      target: dev
    environment: *app-environment
    command: ["./node_modules/.bin/tsx", "packages/db/prisma/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: .
      target: dev
    environment: *app-environment
    command: ["pnpm", "--filter", "@tymra/web", "dev"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - browser_worker_evidence:/browser-evidence:ro
    networks:
      - default
      - ingress
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=local"
      - "traefik.http.routers.tymra-public.rule=Host(`tymra.test`)"
      - "traefik.http.routers.tymra-public.entrypoints=websecure"
      - "traefik.http.routers.tymra-public.tls=true"
      - "traefik.http.routers.tymra-public.service=tymra-web"
      - "traefik.http.routers.tymra-ops.rule=Host(`ops.tymra.test`)"
      - "traefik.http.routers.tymra-ops.entrypoints=websecure"
      - "traefik.http.routers.tymra-ops.tls=true"
      - "traefik.http.routers.tymra-ops.service=tymra-web"
      - "traefik.http.services.tymra-web.loadbalancer.server.port=3000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/en || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      target: dev
    environment: *app-environment
    command: ["./node_modules/.bin/tsx", "apps/worker/src/index.ts"]
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - browser_worker_evidence:/browser-evidence:ro

  api:
    build:
      context: .
      target: dev
    environment: *app-environment
    command: ["./node_modules/.bin/tsx", "apps/worker/src/api.ts"]
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      default:
        aliases:
          - tymra-worker-api
      ingress: {}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=local"
      - "traefik.http.routers.tymra-worker-diagnostics.rule=Host(`worker.tymra.test`) && (Path(`/worker/health`) || Path(`/worker/readiness`))"
      - "traefik.http.routers.tymra-worker-diagnostics.entrypoints=websecure"
      - "traefik.http.routers.tymra-worker-diagnostics.tls=true"
      - "traefik.http.routers.tymra-worker-diagnostics.service=tymra-worker-api"
      - "traefik.http.services.tymra-worker-api.loadbalancer.server.port=3100"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/worker/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  scheduler:
    build:
      context: .
      target: dev
    environment: *app-environment
    command: ["./node_modules/.bin/tsx", "apps/worker/src/scheduler.ts"]
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  browser-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/browser-worker/Dockerfile
    environment:
      BROWSER_WORKER_HOST: 0.0.0.0
      BROWSER_WORKER_PORT: 18888
      BROWSER_WORKER_TOKEN: ${CRON_SECRET:?Set CRON_SECRET in .env}
      BROWSER_WORKER_EVIDENCE_ROOT: /data/browser-worker/evidence
      BROWSER_WORKER_PROFILE_ROOT: /data/browser-worker/profiles
      BROWSER_PROFILE_ENCRYPTION_KEY: ${BROWSER_PROFILE_ENCRYPTION_KEY:-}
      BROWSER_WORKER_EVIDENCE_TTL_HOURS: ${RAW_ARTIFACT_TTL_HOURS:-72}
      BROWSER_WORKER_FAILURE_EVIDENCE_TTL_HOURS: ${RAW_ARTIFACT_FAILURE_TTL_HOURS:-168}
      BROWSER_WORKER_TIMEOUT_MS: ${BROWSER_WORKER_TIMEOUT_MS:-60000}
      BROWSER_WORKER_CONCURRENCY: 1
      BROWSER_WORKER_HEADED: ${BROWSER_WORKER_HEADED:-true}
      BROWSER_WORKER_ALLOW_PRIVATE_NETWORK: "true"
      BROWSER_WORKER_PRIVATE_HOSTS: browser-fixture
      BROWSER_WORKER_ALLOW_HTTP: "true"
      ULIXEE_CLOUD_URL: ws://ulixee-cloud:1818
    ports:
      - "127.0.0.1:18888:18888"
    volumes:
      - browser_worker_evidence:/data/browser-worker/evidence
      - browser_worker_profiles:/data/browser-worker/profiles
    depends_on:
      ulixee-cloud:
        condition: service_started
      browser-fixture:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18888/internal/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default:
        aliases:
          - tymra-browser-worker
      browser_control: {}

  ulixee-cloud:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/browser-worker/Dockerfile.ulixee-cloud
    environment:
      BROWSERS_DIR: /app/ulixee/.cache/ulixee-chrome
      DISPLAY: :99
    ipc: host
    shm_size: "2gb"
    ports:
      - "127.0.0.1:1819:1818"
    restart: unless-stopped
    networks:
      - browser_control
      - browser_egress

  browser-fixture:
    image: nginx:1.27-alpine
    volumes:
      - ./test/fixtures/browser:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - browser_control
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      default:
        aliases:
          - tymra-mailpit
      ingress: {}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=local"
      - "traefik.http.routers.tymra-mail.rule=Host(`mail.tymra.test`)"
      - "traefik.http.routers.tymra-mail.entrypoints=websecure"
      - "traefik.http.routers.tymra-mail.tls=true"
      - "traefik.http.routers.tymra-mail.service=tymra-mailpit"
      - "traefik.http.services.tymra-mailpit.loadbalancer.server.port=8025"

volumes:
  postgres_data:
  redis_data:
  browser_worker_evidence:
  browser_worker_profiles:

networks:
  ingress:
    name: local
    external: true
  browser_control:
    name: tymra_browser_control
    internal: true
  browser_egress:
    name: tymra_browser_egress_dev
