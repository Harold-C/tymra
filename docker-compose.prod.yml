name: tymra

x-app-image: &app-image
  image: ${TYMRA_IMAGE:-tymra:local}
  build:
    context: .
    target: production

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://tymra:${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD}@tymra-postgres:5432/tymra
  REDIS_URL: redis://tymra-redis:6379
  BASE_DOMAIN: ${HOST_BASE_DOMAIN:-tymra.nz}
  APP_BASE_URL: https://${HOST_PUBLIC:?Set HOST_PUBLIC}
  PUBLIC_ORIGIN: https://${HOST_PUBLIC:?Set HOST_PUBLIC}
  ADMIN_ORIGIN: https://${HOST_OPS:?Set HOST_OPS}
  WORKER_INTERNAL_URL: http://tymra-worker-api:3100
  BROWSER_WORKER_INTERNAL_URL: http://tymra-browser-worker:18888
  BROWSER_WORKER_TOKEN: ${PROD_BROWSER_WORKER_TOKEN:?Set PROD_BROWSER_WORKER_TOKEN}
  BROWSER_WORKER_TIMEOUT_MS: ${PROD_BROWSER_WORKER_TIMEOUT_MS:-60000}
  BROWSER_EVIDENCE_ROOT: /browser-evidence
  EVENTFINDA_MIN_DELAY_MS: ${PROD_EVENTFINDA_MIN_DELAY_MS:-4000}
  EVENTFINDA_DELAY_JITTER_MS: ${PROD_EVENTFINDA_DELAY_JITTER_MS:-3000}
  EVENTFINDA_DAILY_REQUEST_BUDGET: ${PROD_EVENTFINDA_DAILY_REQUEST_BUDGET:-2500}
  EVENTFINDA_DISCOVERY_MAX_PAGES: ${PROD_EVENTFINDA_DISCOVERY_MAX_PAGES:-250}
  EVENTFINDA_DETAIL_BATCH_SIZE: ${PROD_EVENTFINDA_DETAIL_BATCH_SIZE:-80}
  TICKETMASTER_MIN_DELAY_MS: ${PROD_TICKETMASTER_MIN_DELAY_MS:-5000}
  TICKETMASTER_DELAY_JITTER_MS: ${PROD_TICKETMASTER_DELAY_JITTER_MS:-4000}
  TICKETMASTER_DAILY_REQUEST_BUDGET: ${PROD_TICKETMASTER_DAILY_REQUEST_BUDGET:-20}
  TICKETMASTER_DISCOVERY_MAX_PAGES: ${PROD_TICKETMASTER_DISCOVERY_MAX_PAGES:-5}
  TICKETMASTER_DETAIL_BATCH_SIZE: ${PROD_TICKETMASTER_DETAIL_BATCH_SIZE:-3}
  SESSION_SECRET: ${PROD_SESSION_SECRET:?Set PROD_SESSION_SECRET}
  ADMIN_EMAIL: ${PROD_ADMIN_EMAIL:?Set PROD_ADMIN_EMAIL}
  ADMIN_PASSWORD_HASH: ${PROD_ADMIN_PASSWORD_HASH:?Set PROD_ADMIN_PASSWORD_HASH}
  RESULT_TOKEN_SECRET: ${PROD_RESULT_TOKEN_SECRET:?Set PROD_RESULT_TOKEN_SECRET}
  ACCESS_KEY_SECRET: ${PROD_ACCESS_KEY_SECRET:?Set PROD_ACCESS_KEY_SECRET}
  DATA_ENCRYPTION_KEY: ${PROD_DATA_ENCRYPTION_KEY:?Set PROD_DATA_ENCRYPTION_KEY}
  CRON_SECRET: ${PROD_CRON_SECRET:?Set PROD_CRON_SECRET}
  PROVIDER_MODE: live
  DEFAULT_MARKET: ${PROD_DEFAULT_MARKET:-christchurch}
  AUTO_PUBLISH_ENABLED: ${PROD_AUTO_PUBLISH_ENABLED:-false}
  ACCEPT_NEW_CHECKS: ${PROD_ACCEPT_NEW_CHECKS:-false}
  EMAIL_PROVIDER: smtp
  EMAIL_FROM: ${PROD_EMAIL_FROM:?Set PROD_EMAIL_FROM}
  SMTP_URL: ${PROD_SMTP_URL:?Set PROD_SMTP_URL}
  RESULT_LINK_TTL_DAYS: ${PROD_RESULT_LINK_TTL_DAYS:-14}
  MAGIC_LINK_TTL_MINUTES: ${PROD_MAGIC_LINK_TTL_MINUTES:-15}
  CUSTOMER_SESSION_TTL_DAYS: ${PROD_CUSTOMER_SESSION_TTL_DAYS:-30}
  ROUGH_RESULT_CACHE_HOURS: ${PROD_ROUGH_RESULT_CACHE_HOURS:-6}
  ANONYMOUS_CHECK_RETENTION_DAYS: ${PROD_ANONYMOUS_CHECK_RETENTION_DAYS:-7}
  RESULT_NOTIFICATION_GRACE_SECONDS: ${PROD_RESULT_NOTIFICATION_GRACE_SECONDS:-120}
  WORKER_ID: tymra-worker-production
  WORKER_POLL_INTERVAL_MS: ${PROD_WORKER_POLL_INTERVAL_MS:-1000}
  WORKER_LEASE_SECONDS: ${PROD_WORKER_LEASE_SECONDS:-120}
  WORKER_API_HOST: 0.0.0.0
  WORKER_API_PORT: 3100
  SCHEDULER_ENABLED: ${PROD_SCHEDULER_ENABLED:-true}
  HIGH_FREQUENCY_SCHEDULER_ENABLED: ${PROD_HIGH_FREQUENCY_SCHEDULER_ENABLED:-false}
  PUBLIC_COLLECTION_MODE: live
  FIXTURE_COLLECTION_ENABLED: "false"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tymra
      POSTGRES_USER: tymra
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tymra -d tymra"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      default:
        aliases:
          - tymra-postgres

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - tymra-redis

  migrate:
    <<: *app-image
    environment: *app-environment
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-image
    environment: *app-environment
    command: ["pnpm", "--filter", "@tymra/web", "start"]
    volumes:
      - browser_worker_evidence:/browser-evidence:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/en || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - ingress
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-tymra_ingress}"
      - "traefik.http.routers.tymra-public.rule=Host(`${HOST_PUBLIC:?Set HOST_PUBLIC}`)"
      - "traefik.http.routers.tymra-public.entrypoints=websecure"
      - "traefik.http.routers.tymra-public.tls=true"
      - "traefik.http.routers.tymra-public.service=tymra-web"
      - "traefik.http.routers.tymra-ops.rule=Host(`${HOST_OPS:?Set HOST_OPS}`)"
      - "traefik.http.routers.tymra-ops.entrypoints=websecure"
      - "traefik.http.routers.tymra-ops.tls=true"
      - "traefik.http.routers.tymra-ops.service=tymra-web"
      - "traefik.http.routers.tymra-www.rule=Host(`${HOST_WWW:-www.tymra.nz}`)"
      - "traefik.http.routers.tymra-www.entrypoints=websecure"
      - "traefik.http.routers.tymra-www.tls=true"
      - "traefik.http.routers.tymra-www.middlewares=tymra-www-redirect"
      - "traefik.http.routers.tymra-www.service=tymra-web"
      - "traefik.http.middlewares.tymra-www-redirect.redirectregex.regex=^https?://www\\.([^/]+)(/.*)?$"
      - "traefik.http.middlewares.tymra-www-redirect.redirectregex.replacement=https://$${1}$${2}"
      - "traefik.http.middlewares.tymra-www-redirect.redirectregex.permanent=true"
      - "traefik.http.services.tymra-web.loadbalancer.server.port=3000"

  worker:
    <<: *app-image
    environment: *app-environment
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - browser_worker_evidence:/browser-evidence:ro

  api:
    <<: *app-image
    environment: *app-environment
    command: ["node", "apps/worker/dist/api.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/worker/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      default:
        aliases:
          - tymra-worker-api

  scheduler:
    <<: *app-image
    environment: *app-environment
    command: ["node", "apps/worker/dist/scheduler.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  browser-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/browser-worker/Dockerfile
    environment:
      BROWSER_WORKER_HOST: 0.0.0.0
      BROWSER_WORKER_PORT: 18888
      BROWSER_WORKER_TOKEN: ${PROD_BROWSER_WORKER_TOKEN:?Set PROD_BROWSER_WORKER_TOKEN}
      BROWSER_WORKER_EVIDENCE_ROOT: /data/browser-worker/evidence
      BROWSER_WORKER_PROFILE_ROOT: /data/browser-worker/profiles
      BROWSER_PROFILE_ENCRYPTION_KEY: ${PROD_BROWSER_PROFILE_ENCRYPTION_KEY:?Set PROD_BROWSER_PROFILE_ENCRYPTION_KEY}
      BROWSER_WORKER_EVIDENCE_TTL_HOURS: ${PROD_RAW_ARTIFACT_TTL_HOURS:-72}
      BROWSER_WORKER_FAILURE_EVIDENCE_TTL_HOURS: ${PROD_RAW_ARTIFACT_FAILURE_TTL_HOURS:-168}
      BROWSER_WORKER_TIMEOUT_MS: ${PROD_BROWSER_WORKER_TIMEOUT_MS:-60000}
      BROWSER_WORKER_CONCURRENCY: ${PROD_BROWSER_WORKER_CONCURRENCY:-1}
      BROWSER_WORKER_HEADED: ${PROD_BROWSER_WORKER_HEADED:-true}
      BROWSER_WORKER_ALLOW_PRIVATE_NETWORK: "false"
      BROWSER_WORKER_ALLOW_HTTP: "false"
      ULIXEE_CLOUD_URL: ws://ulixee-cloud:1818
    volumes:
      - browser_worker_evidence:/data/browser-worker/evidence
      - browser_worker_profiles:/data/browser-worker/profiles
    depends_on:
      - ulixee-cloud
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18888/internal/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default:
        aliases:
          - tymra-browser-worker
      browser_control: {}

  ulixee-cloud:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/browser-worker/Dockerfile.ulixee-cloud
    environment:
      BROWSERS_DIR: /app/ulixee/.cache/ulixee-chrome
    ipc: host
    shm_size: "2gb"
    restart: unless-stopped
    networks:
      - browser_control
      - browser_egress

volumes:
  postgres_data:
  redis_data:
  browser_worker_evidence:
  browser_worker_profiles:

networks:
  default:
    name: tymra_internal
    internal: true
  ingress:
    name: ${TRAEFIK_DOCKER_NETWORK:-tymra_ingress}
    external: true
  browser_egress:
    name: tymra_browser_egress
  browser_control:
    name: tymra_browser_control
    internal: true
